name: CI

on:
  push:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # The tests start their own Postgres container.
      - run: uv run pytest
      - run: docker build -t sticker-api .
      - name: Check the production compose file
        run: |
          cp .env.example .env
          PROXY_NETWORK=proxy STICKER_DB_PASSWORD=x docker compose config --quiet
