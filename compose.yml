services:
  sticker-db:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${STICKER_DB_USER}
      POSTGRES_PASSWORD: ${STICKER_DB_PASSWORD}
      POSTGRES_DB: ${STICKER_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data

  sticker-api:
    image: sticker-api:latest
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - sticker-db